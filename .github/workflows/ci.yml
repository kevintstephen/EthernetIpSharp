name: CI

on:
  push:
    branches:
      - master
      - 'run-*'
  pull_request:

jobs:
  build-and-test:
    name: Build and test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/packages.lock.json

      - name: Restore
        run: dotnet restore EthernetIPSharp.slnx

      - name: Build
        run: dotnet build EthernetIPSharp.slnx --no-restore -c Release

      - name: Build off-solution projects
        run: |
          for project in \
            tests/ScannerRealPLC/ScannerRealPLC.csproj \
            tests/SafetyScannerTest/SafetyScannerTest.csproj \
            tests/LogixHost/LogixHost.csproj \
            tests/ConnectedExplicitSmoke/ConnectedExplicitSmoke.csproj \
            samples/CipEchoServer/CipEchoServer.csproj; do
            echo "::group::$project"
            dotnet build "$project" -c Release
            echo "::endgroup::"
          done

      - name: Test
        run: dotnet test EthernetIPSharp.slnx --no-build -c Release --blame-hang --blame-hang-timeout 120s --logger trx

      - name: Pack NuGet rollup
        run: dotnet pack packaging/EthernetIPSharp.Nuget/EthernetIPSharp.Nuget.csproj --no-build -c Release

      - name: Verify NuGet package contents
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(artifacts/nuget/*.nupkg)
          if [ "${#packages[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one .nupkg, found ${#packages[@]}"
            exit 1
          fi
          lib_entries=$(unzip -Z1 "${packages[0]}" | grep '^lib/' | sort)
          expected=$(for lib in Cip Connections Device Logix Protocol Safety; do
            for ext in dll pdb xml; do
              echo "lib/net10.0/EthernetIPSharp.$lib.$ext"
            done
          done | sort)
          if [ "$lib_entries" != "$expected" ]; then
            echo "::error::Unexpected lib/ contents in ${packages[0]}"
            diff <(echo "$expected") <(echo "$lib_entries") || true
            exit 1
          fi
          echo "${packages[0]}: $(echo "$lib_entries" | wc -l) lib/net10.0 entries OK"

      - name: Upload test results and hang dumps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/**'
          if-no-files-found: ignore
